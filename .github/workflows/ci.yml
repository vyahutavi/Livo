name: LIVO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pyyaml pytest

      - name: Run tests
        run: |
          python -m pytest \
            test_full_system.py \
            test_multimodal.py \
            test_speech.py \
            -v --tb=short

      - name: Verify model
        run: python verify_125m.py
