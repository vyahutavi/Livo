name: LIVO CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------ #
  #  Lint & Format Check                                          #
  # ------------------------------------------------------------ #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --max-complexity=15 --statistics --exit-zero

  # ------------------------------------------------------------ #
  #  Unit Tests                                                    #
  # ------------------------------------------------------------ #
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy datasets pyyaml pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest \
            test_traditional_tokenizer.py \
            test_multimodal.py \
            test_speech.py \
            test_full_system.py \
            -v --tb=short \
            --cov=data --cov=model \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ------------------------------------------------------------ #
  #  Docker Build                                                  #
  # ------------------------------------------------------------ #
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag livo:${{ github.sha }} \
            --tag livo:latest \
            --file Dockerfile .

      - name: Verify Docker image
        run: |
          docker run --rm livo:latest python -c "
          import torch
          from model.llm import LLM, Config
          from data.tokenizer import livorator
          from data.traditional_tokenizer import WordTokenizer, CharTokenizer
          print('✅ All imports OK')
          print(f'   PyTorch: {torch.__version__}')
          print(f'   CUDA available: {torch.cuda.is_available()}')
          "

  # ------------------------------------------------------------ #
  #  Model Verification                                            #
  # ------------------------------------------------------------ #
  verify:
    name: Model Verification
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy datasets pyyaml pytest

      - name: Verify 125M parameter count
        run: python verify_125m.py

      - name: Verify tokenizer round-trip
        run: |
          python -c "
          from data.tokenizer import livorator
          from data.traditional_tokenizer import WordTokenizer, CharTokenizer

          # BPE tokenizer
          tok = livorator(vocab_size=16384)
          text = 'Hello, LIVO!'
          assert tok.decode(tok.encode(text)) == text, 'BPE round-trip failed'

          # Word tokenizer
          wt = WordTokenizer(vocab_size=500)
          wt.build_vocab(['Hello world', 'LIVO is great'])
          assert 'Hello' in wt.decode(wt.encode('Hello'))

          # Char tokenizer
          ct = CharTokenizer()
          assert ct.decode(ct.encode(text)) == text, 'Char round-trip failed'

          print('✅ All tokenizer round-trips passed')
          "
